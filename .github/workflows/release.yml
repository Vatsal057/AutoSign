name: Build and Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller --noconsole --onefile --name AutoSign_${{ matrix.os }} app.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoSign-${{ matrix.os }}
        path: dist/AutoSign_${{ matrix.os }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          AutoSign-ubuntu-latest/AutoSign_ubuntu-latest
          AutoSign-macos-latest/AutoSign_macos-latest
          AutoSign-windows-latest/AutoSign_windows-latest.exe
        generate_release_notes: true
